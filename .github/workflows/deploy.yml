name: 部署 Hexo 到 GitHub Pages

on:
  push:
    branches: [ master ]  # 如果您的默认分支是 master，请改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          submodules: true  # 如果主题是子模块，保留此行

      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 安装 Hexo 依赖
        run: |
          npm install -g hexo-cli
          npm install

      - name: 生成静态文件
        run: npm run build  # 即 hexo generate

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          publish_branch: gh-pages
