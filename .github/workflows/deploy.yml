name: 部署 Hexo 到 GitHub Pages

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Hexo CLI
        run: npm install -g hexo-cli

      - name: 安装依赖
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: 调试：检查依赖版本
        run: |
          echo "=== Node.js 版本 ==="
          node -v
          echo "=== Hexo 版本 ==="
          npm list hexo
          echo "=== Generator 版本 ==="
          npm list hexo-generator-archive hexo-generator-category hexo-generator-index hexo-generator-tag
          echo "=== strip-ansi 版本 ==="
          npm list strip-ansi

      - name: 生成静态文件
        run: |
          npm run clean
          npm run build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          publish_branch: gh-pages